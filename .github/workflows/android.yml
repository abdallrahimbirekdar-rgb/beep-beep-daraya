name: Build Shahin Android
on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: shahin-android
  cancel-in-progress: false
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build APK
        working-directory: android
        run: gradle --no-daemon :app:assembleRelease
      - name: Verify and publish APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk shahin.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose shahin.apk
          sha256sum shahin.apk > shahin.apk.sha256
          gh release view android-v1.0.0 >/dev/null 2>&1 || gh release create android-v1.0.0 --target "$GITHUB_SHA" --title 'Shahin Android 1.0.0' --notes 'Android application for Shahin Daraya. Internet connection required. Install shahin.apk.'
          gh release upload android-v1.0.0 shahin.apk shahin.apk.sha256 --clobber
      - uses: actions/upload-artifact@v4
        with:
          name: shahin-android-apk
          path: shahin.apk
