name: Build Souq Daraya Android
on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: shahin-android
  cancel-in-progress: false
jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_PATH: /tmp/daraya-release.jks
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore permanent signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing signing secret: $name. See android/SIGNING.md."
              exit 1
            fi
          done
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          echo "ANDROID_VERSION_CODE=$((100 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install SDK
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"'
      - name: Build APK
        working-directory: android
        run: gradle --no-daemon :app:assembleRelease :app:bundleRelease
      - name: Verify and publish APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cp android/app/build/outputs/apk/release/app-release.apk souq-daraya.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs souq-daraya.apk
          sha256sum souq-daraya.apk > souq-daraya.apk.sha256
          cp android/app/build/outputs/bundle/release/app-release.aab souq-daraya.aab
          jarsigner -verify souq-daraya.aab
          NOTES='Daraya Android 1.4.3. Signed with the permanent release key. Future builds using this key support in-place updates. Older builds signed with disposable development keys may require a one-time reinstall. Internet required. The legacy release tag is retained for existing website download links.'
          gh release view android-v1.3.0 >/dev/null 2>&1 || gh release create android-v1.3.0 --target "$GITHUB_SHA" --title 'Daraya Android 1.4.3' --notes "$NOTES"
          gh release edit android-v1.3.0 --title 'Daraya Android 1.4.3' --notes "$NOTES"
          gh release upload android-v1.3.0 souq-daraya.apk souq-daraya.apk.sha256 souq-daraya.aab --clobber
          APK_ASSET_ID=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/android-v1.3.0" --jq '.assets[] | select(.name == "souq-daraya.apk") | .id')
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/assets/$APK_ASSET_ID" -f label="daraya-version-code:$ANDROID_VERSION_CODE"
      - uses: actions/upload-artifact@v4
        with:
          name: shahin-android-apk
          path: |
            souq-daraya.apk
            souq-daraya.aab
      - name: Remove private signing file
        if: always()
        run: rm -f "$ANDROID_KEYSTORE_PATH"

